plugins {
	id 'net.neoforged.moddev' version "${moddev_version}"
}

// The NeoForge build of the mod: the loader-neutral code, assets and data in ../common, with the NeoForge entry points and glue here,
// compiled together into one jar, for one Minecraft version (-Pmc=<version>, default the base version; see ../gradle/versions.gradle).
// Its shape follows NeoForge's own ModDevGradle template (github.com/NeoForgeMDKs).
apply from: rootProject.file('gradle/versions.gradle')

// The mod's version (and its description) are set in one place for both loaders: fabric/src/main/resources/fabric.mod.json; this
// jar's version is that plus "+<label>" (versions/versions.properties).
version = modVersion
group = 'io.github.esclovrrivulet.creel'

base {
	archivesName = 'reel-n-creel-neoforge'
}

useVersionSources(sourceSets.main, ['common', 'neoforge'])

neoForge {
	// To change the version see versions/versions.properties
	version = mcValue('neo')

	runs {
		client {
			client()
		}
		server {
			server()
			programArgument '--nogui'
		}
	}

	mods {
		creel {
			sourceSet(sourceSets.main)
		}
	}
}

// META-INF/neoforge.mods.toml is filled in from fabric.mod.json and versions/versions.properties
def modProperties = [
	mod_version            : modVersion,
	mod_description        : modDescription,
	neo_version            : mcValue('neo_min'),
	minecraft_version_range: mcValue('neo_minecraft'),
]
processResources {
	inputs.properties modProperties
	filesMatching('META-INF/neoforge.mods.toml') {
		expand modProperties
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = javaRelease
	it.options.encoding = 'UTF-8'
}

java {
	sourceCompatibility = JavaVersion.toVersion(javaRelease)
	targetCompatibility = JavaVersion.toVersion(javaRelease)
}

jar {
	// the licence travels with the jar
	from(rootProject.file('LICENSE'))
}
