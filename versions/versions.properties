# The Minecraft versions Reel n Creel is built for, and what each one is built against: the one table every build reads.
#
#   ./gradlew build               builds the base version (below) for Fabric and NeoForge
#   ./gradlew build -Pmc=26.2     builds 26.2, likewise for any version listed here
#
# The source is one tree for every version. common/, fabric/ and neoforge/ are written for the base version. An older version's
# differences are in versions/<version>/, a folder laid out exactly as the main tree (versions/26.2/common/src/main/java/...): a file
# there replaces the file at the same path in the main tree for that version's build, and nothing else changes. The Java differences
# are kept small: every call of the game that differs between versions goes through compat/Compat.java and compat/ClientCompat.java
# (one copy per version, the same names in each), and a few cosmetic mixins whose target differs have a copy per version. The data
# files under versions/<version>/common/src/main/resources/ are generated from the main tree's (the loot tables, the advancement and
# the cooking recipes are written in each version's own format): never edit them by hand.
#
# base       the version the main source tree is written for (it has no versions/<base>/ folder)
# versions   every version built, newest first
base=26.3
versions=26.3,26.2,26.1.2,1.21.1

# Per version. fabric_api: the Fabric API it is compiled against (https://fabricmc.net/develop). fabric_minecraft: the game versions the
# Fabric jar's fabric.mod.json accepts. neo: the NeoForge version it is compiled against (https://projects.neoforged.net/neoforged/neoforge).
# neo_min: the oldest NeoForge the NeoForge jar accepts. neo_minecraft: the game versions the NeoForge jar accepts. label: the game
# version(s) the jars are named for. data_rules: how the main tree's data files are rewritten for that version (empty for the base).
# Fabric Loader, Loom and ModDevGradle are the same for every version (gradle.properties). The mod's own version is in
# fabric/src/main/resources/fabric.mod.json; each jar's version is that plus "+<label>", e.g. 1.0.0+26.2.
26.3.fabric_api=0.162.0+26.3
26.3.fabric_minecraft=~26.3
26.3.neo=26.3.0.113
26.3.neo_min=26.3.0.113
26.3.neo_minecraft=[26.3]
26.3.label=26.3
26.3.data_rules=

26.2.fabric_api=0.161.0+26.2
26.2.fabric_minecraft=~26.2
26.2.neo=26.2.0.95
26.2.neo_min=26.2.0.95
26.2.neo_minecraft=[26.2]
26.2.label=26.2
26.2.data_rules=loot_functions,loot_tag_entries,advancement_recipe,cooking_times

# Built against 26.1.2, run on all of 26.1.x: the same jars were proven on 26.1, 26.1.1 and 26.1.2 (each loader), so they accept
# 26.1 up to, not including, 26.2, and NeoForge from 26.1.0.19-beta (the newest NeoForge for 26.1 when this was proven), and are
# named 1.0.0+26.1.
26.1.2.fabric_api=0.155.3+26.1.2
26.1.2.fabric_minecraft=~26.1
26.1.2.neo=26.1.2.128
26.1.2.neo_min=26.1.0.19-beta
26.1.2.neo_minecraft=[26.1,26.2)
26.1.2.label=26.1
26.1.2.data_rules=loot_functions,loot_tag_entries,entity_predicates,advancement_recipe,cooking_times

# 1.21.1 (1.0.0): a game of an older line, further from the base than the 26.x patches, so its build differs in more than files:
# java: the Java release it is compiled for (the others: 25, Java 25's; 1.21.1 runs on Java 21; Gradle must find a Java 21 on the
# machine to build it). loom: "remap" where the game is obfuscated (1.21.1): the Fabric jar is built with Loom's remapping plugin,
# which compiles against Mojang's names and writes Fabric's intermediary names into the jar (the 26.x games need no remapping).
# Its source is the main tree rewritten at assembly by versions/1.21.1/java_renames.txt (the older names of the same classes and
# methods), less the files versions/1.21.1/left_out.txt lists, with its overlay on top (see those two files).
1.21.1.fabric_api=0.116.18+1.21.1
1.21.1.fabric_minecraft=1.21.1
1.21.1.neo=21.1.267
1.21.1.neo_min=21.1.267
1.21.1.neo_minecraft=[1.21.1]
1.21.1.label=1.21.1
1.21.1.data_rules=loot_functions,loot_tag_entries,entity_predicates,advancement_recipe,cooking_times,recipe_ingredients,item_models
1.21.1.java=21
1.21.1.loom=remap
