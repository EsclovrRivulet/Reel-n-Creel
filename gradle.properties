# Memory for Gradle (the game's jars are large)
org.gradle.jvmargs=-Xmx2G

# The same for every Minecraft version. Fabric: check these on https://fabricmc.net/develop
loader_version=0.19.5
loom_version=1.19-SNAPSHOT
# NeoForge's ModDevGradle: https://projects.neoforged.net/neoforged/moddevgradle
moddev_version=2.0.148

# The Minecraft version is chosen with -Pmc=<version> (./gradlew build -Pmc=26.2); without it, the base version. Each version's game,
# Fabric API and NeoForge versions are in versions/versions.properties.
# The mod's own version is not here: it is read from fabric/src/main/resources/fabric.mod.json.
